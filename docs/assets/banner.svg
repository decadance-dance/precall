<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">precall · Project Recall, a versioned map built from a project's own sources</title>
  <desc id="desc">The command precall run &amp;&amp; precall open. Five sources, the repo, its git history, GitHub, Slack and your own plugins, feed one run: fingerprint, collect, check, judge, rework of rejected changes, up to 2 rounds by default, commit. The run writes the map, kept in its own git repository, with six branches: layout, how-it-works, people, done, blocked and decisions; one new node lands under decisions. The commit reads run 2026-11-19T09:14Z: +3 ~1 -0 (rejected 2). The tagline: your project's sources in, one map out; nothing due: no model call, no change. Exit codes: 0 done, 4 aborted, 5 partial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#06150f"/><stop offset="0.5" stop-color="#0b0b10"/><stop offset="1" stop-color="#08100e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#26262f"/>

  <g id="title-block">
    <rect x="64" y="72" width="330" height="36" rx="10" fill="#14141c" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="82" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e5e5e5"><tspan fill="#34d399">$</tspan> precall run <tspan fill="#8b8b9a">&amp;&amp;</tspan> precall open</text>
    <rect x="372" y="82" width="9" height="17" rx="1" fill="#e5e5e5" opacity="0.8"/>
    <text x="58" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#word)">precall</text>
    <text x="64" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#c4c4cc">Project Recall · a versioned project map</text>
    <text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#c4c4cc">nothing due: no model call, no change.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="64" y="331" fill="#8b8b9a">exit</text>
      <rect x="108" y="312" width="104" height="28" rx="14" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="160" y="331" text-anchor="middle" fill="#e5e5e5"><tspan fill="#34d399" font-weight="700">0</tspan> <tspan fill="#8b8b9a">·</tspan> done</text>
      <rect x="224" y="312" width="116" height="28" rx="14" fill="none" stroke="#3a3a48" stroke-width="1.5"/>
      <text x="282" y="331" text-anchor="middle" fill="#e5e5e5"><tspan font-weight="700">4</tspan> <tspan fill="#8b8b9a">·</tspan> aborted</text>
      <rect x="352" y="312" width="116" height="28" rx="14" fill="none" stroke="#3a3a48" stroke-width="1.5"/>
      <text x="410" y="331" text-anchor="middle" fill="#e5e5e5"><tspan font-weight="700">5</tspan> <tspan fill="#8b8b9a">·</tspan> partial</text>
    </g>
  </g>

  <g id="sources" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="560" y="58" font-size="12" letter-spacing="1" fill="#5b5b68">SOURCES</text>
    <g fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.55">
      <path d="M676 87 C 700 87, 698 181, 722 181"/>
      <path d="M676 133 C 700 133, 698 181, 722 181"/>
      <path d="M676 179 C 700 179, 698 181, 722 181"/>
      <path d="M676 225 C 700 225, 698 181, 722 181"/>
      <path d="M676 271 C 700 271, 698 181, 722 181" stroke-dasharray="3 3"/>
    </g>
    <rect x="560" y="70" width="116" height="34" rx="10" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="576" y="92" fill="#e5e5e5">repo</text>
    <rect x="560" y="116" width="116" height="34" rx="10" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="576" y="138" fill="#e5e5e5">git history</text>
    <rect x="560" y="162" width="116" height="34" rx="10" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="576" y="184" fill="#e5e5e5">GitHub</text>
    <rect x="560" y="208" width="116" height="34" rx="10" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="576" y="230" fill="#e5e5e5">Slack</text>
    <rect x="560" y="254" width="116" height="34" rx="10" fill="#0d0d14" stroke="#3a3a48" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="576" y="276" fill="#8b8b9a">+ plugins</text>
  </g>

  <g id="run" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="722" y="70" width="140" height="218" rx="12" fill="#0d0d14" stroke="#34d399" stroke-width="1.5"/>
    <path d="M722 104 H862" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="738" y="92" fill="#34d399" font-weight="700">precall run</text>
    <path d="M744 128 V266" stroke="#2a2a36" stroke-width="1.5"/>
    <circle cx="744" cy="128" r="4" fill="#5b5b68"/><text x="758" y="132" fill="#c4c4cc">fingerprint</text>
    <circle cx="744" cy="156" r="4" fill="#5b5b68"/><text x="758" y="160" fill="#c4c4cc">collect</text>
    <circle cx="744" cy="184" r="4" fill="#5b5b68"/><text x="758" y="188" fill="#c4c4cc">check</text>
    <circle cx="744" cy="212" r="4" fill="#5b5b68"/><text x="758" y="216" fill="#c4c4cc">judge</text>
    <circle cx="744" cy="240" r="4" fill="#5b5b68"/><text x="758" y="244" fill="#8b8b9a">↺ rework</text>
    <circle cx="744" cy="266" r="4" fill="#34d399"/><text x="758" y="270" fill="#e5e5e5">commit</text>
  </g>
  <text x="792" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8b9a">up to 2 rounds by default</text>
  <path d="M862 181 H894" stroke="#34d399" stroke-width="1.5"/>
  <path d="M888 176 L896 181 L888 186" fill="none" stroke="#34d399" stroke-width="1.5"/>

  <g id="map" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="898" y="52" width="254" height="262" rx="14" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <path d="M898 88 H1152" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="916" y="76" fill="#8b8b9a">map <tspan fill="#5b5b68">· its own git repo</tspan></text>
    <path d="M916 100 V277" stroke="#2a2a36" stroke-width="1.5"/>
    <path d="M916 112 H926 M916 145 H926 M916 178 H926 M916 211 H926 M916 244 H926 M916 277 H926" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="932" y="116" fill="#e5e5e5">layout</text>
    <rect x="1050" y="107" width="44" height="9" rx="4.5" fill="#3a3a48"/><rect x="1100" y="107" width="34" height="9" rx="4.5" fill="#3a3a48"/>
    <text x="932" y="149" fill="#e5e5e5">how-it-works</text>
    <rect x="1050" y="140" width="30" height="9" rx="4.5" fill="#3a3a48"/><rect x="1086" y="140" width="48" height="9" rx="4.5" fill="#3a3a48"/>
    <text x="932" y="182" fill="#e5e5e5">people</text>
    <rect x="1050" y="173" width="56" height="9" rx="4.5" fill="#3a3a48"/>
    <text x="932" y="215" fill="#e5e5e5">done</text>
    <rect x="1050" y="206" width="40" height="9" rx="4.5" fill="#3a3a48"/><rect x="1096" y="206" width="24" height="9" rx="4.5" fill="#3a3a48"/>
    <text x="932" y="248" fill="#e5e5e5">blocked</text>
    <rect x="1050" y="239" width="28" height="9" rx="4.5" fill="#3a3a48"/>
    <text x="932" y="281" fill="#e5e5e5">decisions</text>
    <rect x="1050" y="272" width="36" height="9" rx="4.5" fill="#3a3a48"/>
    <rect x="1092" y="270" width="46" height="13" rx="6.5" fill="#34d399" opacity="0.85"/>
    <text x="1115" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#06150f">+ new</text>
  </g>

  <g id="commit" filter="url(#shadow)">
    <rect x="560" y="330" width="592" height="40" rx="12" fill="#0a1712" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="580" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e5e5e5">run 2026-11-19T09:14Z: <tspan fill="#34d399" font-weight="700">+3 ~1 -0</tspan> <tspan fill="#8b8b9a">(rejected 2)</tspan></text>
  <text x="1134" y="355" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5b5b68">git diff · git blame</text>
</svg>
