[workspace]

[package]
name = "rrecall"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Keeps a versioned map of a software project and answers questions about it"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
